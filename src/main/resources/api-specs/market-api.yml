openapi: 3.0.3
info:
  title: Cosmo Cats Intergalactic Marketplace API
  description: API контракт для маркетплейсу космічних товарів
  version: 1.0.0
paths:
  /api/products:
    get:
      summary: Отримати список товарів з пагінацією
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Успішна відповідь зі списком товарів
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedProductResponse'
    post:
      summary: Створити новий товар
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
      responses:
        '201':
          description: Товар успішно створено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          description: Помилка валідації за RFC 9457
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

    ProblemDetail:
      type: object
      properties:
        type:
          type: string
          example: "https://cosmo-cats.market/errors/validation"
        title:
          type: string
          example: "Validation failed"
        status:
          type: integer
          example: 400
        detail:
          type: string
          example: "Field price must be greater than 0."
        instance:
          type: string
          example: "/api/products"