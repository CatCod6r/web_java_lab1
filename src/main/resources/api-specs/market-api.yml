openapi: 3.0.3
info:
  title: Cosmo Cats Intergalactic Marketplace API
  description: API контракт для маркетплейсу космічних товарів
  version: 1.0.0
paths:
  /api/products:
    get:
      summary: Отримати список товарів з пагінацією
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Успішна відповідь зі списком товарів
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedProductResponse'
    post:
      summary: Створити новий товар
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
      responses:
        '201':
          description: Товар успішно створено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          description: Помилка валідації за RFC 9457
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/products/{id}:
    get:
      summary: Отримати товар за ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Товар знайдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '404':
          description: Товар не знайдено
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    delete:
      summary: Видалити товар
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Товар успішно видалено
        '404':
          description: Товар не знайдено

components:
  schemas:
    CreateProductRequest:
      type: object
      required:
        - name
        - price
        - category
      properties:
        name:
          type: string
          example: "Super Comet Yarn"
        price:
          type: number
          example: 49.99
        description:
          type: string
          example: "Zero gravity toy"
        category:
          type: string
          example: "Toys"

    ProductResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        price:
          type: number
        description:
          type: string
        category:
          type: string

    PagedProductResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ProductResponse'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer

    ProblemDetail:
      type: object
      properties:
        type:
          type: string
          example: "https://cosmo-cats.market/errors/validation"
        title:
          type: string
          example: "Validation failed"
        status:
          type: integer
          example: 400
        detail:
          type: string
          example: "Field price must be greater than 0."
        instance:
          type: string
          example: "/api/products"